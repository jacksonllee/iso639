version: 2.1

orbs:
  win: circleci/windows@5.0

jobs:
  pre-build:
    description: A check that needs to be done on only one supported Python version
    parameters:
      command-run:
        type: string
      latest-supported-python-version:
        type: string
        # Pick the highest Python 3.x version that this package is known to support
        default: "3.14"
    docker:
      - image: cimg/python:<< parameters.latest-supported-python-version >>
    steps:
      - checkout
      - run:
          name: Set up uv virtual environment
          command: |
            uv python install << parameters.latest-supported-python-version >>
            uv venv .venv --managed-python --python=python<< parameters.latest-supported-python-version >>
            source .venv/bin/activate
      - run:
          command: << parameters.command-run >>

  build-python:
    parameters:
      python-version:
        type: string
    docker:
      - image: cimg/python:<< parameters.python-version >>
    steps:
      - checkout
      - run:
          name: Install Python under uv
          command: |
            uv python install << parameters.python-version >>
      - run:
          # Test that we can build a source distribution that can correctly
          # install from clean slate.
          # "python -m build" creates
          # dist/<pkg-name>-x.y.z.tar.gz and dist/<pkg-name>-x.y.z-py3-none-any.whl
          name: Build source distribution, test installing package from it, and clean up
          command: |
              uv venv .venv --managed-python --python=python<< parameters.python-version >>
              source .venv/bin/activate
              uv pip install --no-progress --upgrade pip setuptools build
              uv run python -m build
              uv pip install dist/`ls dist/ | grep .whl`
              deactivate
              rm -rf .venv
      - run:
          name: Set up uv virtual environment for the test suite
          command: |
            uv venv .venv --managed-python --python=python<< parameters.python-version >>
            source .venv/bin/activate
            uv pip install --no-progress -e ".[dev]"
      - run:
          name: Show installed Python packages
          command: |
            uv pip list -v
      - run:
          name: Run python tests
          command: |
            uv run pytest --junitxml=/tmp/testxml/report.xml --durations=0
      - store_test_results:
          path: /tmp/testxml/

  build-python-win:
    executor:
      name: win/default
      shell: powershell.exe
    steps:
      - checkout
      - run: systeminfo
      - run:
          name: Run tests on Windows
          shell: bash.exe
          command: |
            python --version && \
            python.exe -m pip install --upgrade pip setuptools wheel && \
            python.exe -m pip install ".[dev]" && \
            python.exe -m pip list && \
            pytest

workflows:
  version: 2
  build-and-test:
    jobs:
      - pre-build:
          name: flake8
          command-run: |
            uv pip install --no-progress -e ".[dev]" && \
            uv run flake8 src tests
      - pre-build:
          name: black
          command-run: |
            uv pip install --no-progress -e ".[dev]" && \
            uv run black --check src tests
      - pre-build:
          name: mypy
          command-run: |
            uv pip install --no-progress -e ".[dev]" && \
            uv run mypy src
      - pre-build:
          name: twine
          command-run: |
            uv pip install --no-progress -e ".[dev]" && \
            uv run python -m build && \
            uv run twine check dist/`ls dist/ | grep .tar.gz` && \
            uv run twine check dist/`ls dist/ | grep .whl`
      - pre-build:
          name: bandit
          command-run: |
            uv pip install --no-progress -e "." && \
            uv pip install --no-progress --upgrade bandit && \
            uv run bandit --version && \
            uv run bandit -r src -x tests
      - pre-build:
          name: pip-audit
          command-run: |
            uv pip install --no-progress -e "." && \
            uv pip install --no-progress --upgrade pip-audit && \
            uv run pip-audit --version && \
            uv run pip-audit --skip-editable
      - build-python:
          requires:
            - flake8
            - black
            - mypy
            - twine
            - bandit
            - pip-audit
          matrix:
            parameters:
              python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      - build-python-win:
          requires:
            - flake8
            - black
            - mypy
            - twine
            - bandit
            - pip-audit
